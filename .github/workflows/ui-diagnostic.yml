name: ZeroStock UI runner diagnosis

on:
  push:
    branches: [v5-ui-readability]

permissions:
  contents: read

jobs:
  browser:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v5.0.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore and build exact V5.0.1 application
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ui-source"
          cat cloud-build/source.b64.* | base64 --decode > "$RUNNER_TEMP/ui-source/source.zip"
          echo "ece149cfe7e6d85414d82f5d6159ac452ee7faab73bc369a144c278973219ba4  $RUNNER_TEMP/ui-source/source.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/ui-source/source.zip" -d "$RUNNER_TEMP/ui-source/src"
          patch --batch --fuzz=0 -p1 -d "$RUNNER_TEMP/ui-source/src" < cloud-build/ui-readability.patch
          cp cloud-build/prepare-release.mjs "$RUNNER_TEMP/ui-source/src/scripts/"
          cp icon-192.png icon-512.png icon-1024.png "$RUNNER_TEMP/ui-source/src/"
          cd "$RUNNER_TEMP/ui-source/src"
          node -e 'const fs=require("fs");const p=JSON.parse(fs.readFileSync("package.json","utf8"));p.dependencies["@capacitor/app"]="8.1.2";fs.writeFileSync("package.json",JSON.stringify(p,null,2)+"\n")'
          npm install --no-audit --no-fund
          node scripts/prepare-release.mjs 5.0.1
          npm run web:build
      - name: Identify failing browser-runtime or readability stage
        run: |
          set -euo pipefail
          echo "::notice::Runner ${{ matrix.runner }}; $(. /etc/os-release; echo "$PRETTY_NAME")"
          python3 -m venv "$RUNNER_TEMP/ui-qa"
          "$RUNNER_TEMP/ui-qa/bin/python" -m pip install --disable-pip-version-check playwright==1.56.0
          echo '::notice::Playwright package installed'
          if ! "$RUNNER_TEMP/ui-qa/bin/python" -m playwright install --with-deps --only-shell chromium > "$RUNNER_TEMP/browser-install.log" 2>&1; then
            echo '::error::Browser installation failed before UI tests'
            tail -30 "$RUNNER_TEMP/browser-install.log" | sed 's/^/::notice::/'
            exit 1
          fi
          echo '::notice::Browser installation passed; starting isolated UI tests'
          if ! "$RUNNER_TEMP/ui-qa/bin/python" .github/scripts/ui-readability.py --root "$RUNNER_TEMP/ui-source/src/www" > "$RUNNER_TEMP/ui-result.log" 2>&1; then
            head -45 "$RUNNER_TEMP/ui-result.log" | sed 's/^/::error::/'
            exit 1
          fi
          cat "$RUNNER_TEMP/ui-result.log" | sed 's/^/::notice::/'
