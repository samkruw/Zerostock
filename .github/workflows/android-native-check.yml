name: ZeroStock native Android check
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      version_code:
        required: true
        type: number
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Restore candidate source
        env:
          CHECK_VERSION: ${{ inputs.version }}
        run: |
          node cloud-build/restore-source.mjs "$RUNNER_TEMP/zerostock-native" "$CHECK_VERSION"
          echo "ZS_SRC=$RUNNER_TEMP/zerostock-native" >> "$GITHUB_ENV"
      - name: Prepare native project without signing credentials
        working-directory: ${{ env.ZS_SRC }}
        env:
          ZEROSTOCK_VERSION_NAME: ${{ inputs.version }}
          ZEROSTOCK_VERSION_CODE: ${{ inputs.version_code }}
        run: |
          npm install --no-audit --no-fund
          npm run web:build
          npx cap add android
          npm run android:configure
          npm run assets:android
          npx cap sync android
          test "$ZEROSTOCK_VERSION_CODE" -gt 29
          node scripts/configure-release.mjs
      - name: Compile native release
        working-directory: ${{ env.ZS_SRC }}/android
        run: bash "$GITHUB_WORKSPACE/cloud-build/build-android.sh"
