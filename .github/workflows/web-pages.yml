name: ZeroStock V5 Website QA

on:
  push:
    branches:
      - v5-web-main
      - v5-ui-web
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: read

jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify canonical Android web assets
        run: python3 .github/scripts/web-assets.py
      - name: Install isolated browser test runtime
        run: |
          python3 -m venv "$RUNNER_TEMP/web-qa"
          "$RUNNER_TEMP/web-qa/bin/python" -m pip install --disable-pip-version-check playwright==1.56.0
          "$RUNNER_TEMP/web-qa/bin/python" -m playwright install --with-deps --only-shell chromium
      - name: Test desktop and mobile web preview
        env:
          ZEROSTOCK_TEST_EMAIL: ${{ secrets.ZEROSTOCK_TEST_EMAIL }}
          ZEROSTOCK_TEST_PASSWORD: ${{ secrets.ZEROSTOCK_TEST_PASSWORD }}
        run: '"$RUNNER_TEMP/web-qa/bin/python" .github/scripts/web-smoke.py'
      - name: Test content readability and Android safe areas with isolated fixtures
        run: '"$RUNNER_TEMP/web-qa/bin/python" .github/scripts/ui-readability.py'
      - name: Test public website after Pages deployment
        if: github.ref == 'refs/heads/main'
        env:
          ZEROSTOCK_TEST_EMAIL: ${{ secrets.ZEROSTOCK_TEST_EMAIL }}
          ZEROSTOCK_TEST_PASSWORD: ${{ secrets.ZEROSTOCK_TEST_PASSWORD }}
        run: '"$RUNNER_TEMP/web-qa/bin/python" .github/scripts/web-smoke.py --url https://samkruw.github.io/Zerostock/'
