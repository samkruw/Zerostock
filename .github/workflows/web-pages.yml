name: ZeroStock V5 Website QA

on:
  push:
    branches:
      - v5-web-main
      - v5-ui-web
      - feat/plates-container-quantities
      - feat/container-serials
      - feat/business-ui
      - feat/brand-launch
      - feat/smoother-start
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: read

jobs:
  preview:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright/python:v1.56.0-noble
      options: --ipc=host
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify canonical Android web assets
        run: python3 .github/scripts/web-assets.py
      - name: Install the Python client matching the packaged browsers
        run: |
          python -m pip install --disable-pip-version-check --target "$RUNNER_TEMP/web-qa" playwright==1.56.0
          echo "PYTHONPATH=$RUNNER_TEMP/web-qa" >> "$GITHUB_ENV"
      - name: Test desktop and mobile web preview
        env:
          ZEROSTOCK_TEST_EMAIL: ${{ secrets.ZEROSTOCK_TEST_EMAIL }}
          ZEROSTOCK_TEST_PASSWORD: ${{ secrets.ZEROSTOCK_TEST_PASSWORD }}
        run: 'python .github/scripts/web-smoke.py'
      - name: Test article and container controllers with isolated fixtures
        run: |
          python .github/scripts/brand-start.py --root .
          python .github/scripts/articles-ui.py --root .
          python .github/scripts/articles-regressions.py --root .
      - name: Test content readability and Android safe areas with isolated fixtures
        run: 'python .github/scripts/ui-readability.py'
      - name: Test public website after Pages deployment
        if: github.ref == 'refs/heads/main'
        env:
          ZEROSTOCK_TEST_EMAIL: ${{ secrets.ZEROSTOCK_TEST_EMAIL }}
          ZEROSTOCK_TEST_PASSWORD: ${{ secrets.ZEROSTOCK_TEST_PASSWORD }}
        run: 'python .github/scripts/web-smoke.py --url https://samkruw.github.io/Zerostock/'
