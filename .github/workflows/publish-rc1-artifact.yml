name: Publish verified ZeroStock RC1

on:
  push:
    branches:
      - v5-cloud-build
    paths:
      - .github/workflows/publish-rc1-artifact.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: zerostock-publish-rc1
  cancel-in-progress: false

jobs:
  publish-rc1:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout immutable RC source
        uses: actions/checkout@v4
        with:
          ref: v5.0.0-rc.1

      - name: Verify RC commit
        run: test "$(git rev-parse HEAD)" = d38c8dd1f03d3e6174f4b605ab37115383448bd0

      - name: Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Download signed APK from completed build 23
        uses: actions/download-artifact@v4
        with:
          name: ZeroStock-v5.0.0-rc.1
          run-id: 41076169806
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/zerostock-rc1

      - name: Verify signed release assets and source notes
        working-directory: ${{ runner.temp }}/zerostock-rc1
        run: |
          set -euo pipefail
          APK=ZeroStock-v5.0.0-rc.1.apk
          test -s "$APK"
          sha256sum -c "$APK.sha256"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/rc1-signature.txt"
          grep -Fq 'Signer #1 certificate SHA-256 digest: ea278794174af099e57faae01bc8c209a0fbc4fd95dfb3b702d8fa75a9436f8a' "$RUNNER_TEMP/rc1-signature.txt"
          BADGING="$("$BUILD_TOOLS/aapt" dump badging "$APK")"
          PACKAGE="$(printf '%s\n' "$BADGING" | sed -n '1p')"
          [[ "$PACKAGE" == *"name='ch.zerogen.zerostock'"* ]]
          [[ "$PACKAGE" == *"versionName='5.0.0-rc.1'"* ]]
          [[ "$PACKAGE" == *"versionCode='23'"* ]]
          cat "$GITHUB_WORKSPACE"/cloud-build/source.b64.* | base64 --decode > "$RUNNER_TEMP/rc1-source.zip"
          echo "ece149cfe7e6d85414d82f5d6159ac452ee7faab73bc369a144c278973219ba4  $RUNNER_TEMP/rc1-source.zip" | sha256sum -c -
          unzip -p "$RUNNER_TEMP/rc1-source.zip" RELEASE-NOTES-v5.0.0-rc.1.md > "$RUNNER_TEMP/RC-NOTES.md"
          test -s "$RUNNER_TEMP/RC-NOTES.md"
          {
            echo 'Verified RC1 assets from Android build #23; all 40 gates ran before artifact upload.'
            echo "$PACKAGE"
            stat -c 'APK size: %s bytes' "$APK"
            sha256sum "$APK"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish RC1 prerelease
        working-directory: ${{ runner.temp }}/zerostock-rc1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v5.0.0-rc.1 \
            ZeroStock-v5.0.0-rc.1.apk ZeroStock-v5.0.0-rc.1.apk.sha256 \
            --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease \
            --title 'ZeroStock v5.0.0-rc.1' --notes-file "$RUNNER_TEMP/RC-NOTES.md"
          gh release view v5.0.0-rc.1 --repo "$GITHUB_REPOSITORY" --json tagName,isPrerelease,assets,url
