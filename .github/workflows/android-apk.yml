name: ZeroStock V5 Android APK

on:
  push:
    branches:
      - main
      - v5-cloud-build
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zerostock-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore ZeroStock V5 source
        run: |
          mkdir -p "$RUNNER_TEMP/zerostock-v5"
          base64 --decode cloud-build/source.b64 > "$RUNNER_TEMP/zerostock-v5/source.zip"
          unzip -q "$RUNNER_TEMP/zerostock-v5/source.zip" -d "$RUNNER_TEMP/zerostock-v5/src"
          cp icon-192.png icon-512.png icon-1024.png "$RUNNER_TEMP/zerostock-v5/src/"
          echo "ZS_SRC=$RUNNER_TEMP/zerostock-v5/src" >> "$GITHUB_ENV"

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install dependencies
        working-directory: ${{ env.ZS_SRC }}
        run: npm install --no-audit --no-fund

      - name: Static release gates
        working-directory: ${{ env.ZS_SRC }}
        run: npm run test:all

      - name: Build web assets
        working-directory: ${{ env.ZS_SRC }}
        run: npm run web:build

      - name: Create Android project
        working-directory: ${{ env.ZS_SRC }}
        run: npx cap add android

      - name: Configure and sync Android
        working-directory: ${{ env.ZS_SRC }}
        run: |
          npm run android:configure
          npx cap sync android

      - name: Build debug APK
        working-directory: ${{ env.ZS_SRC }}/android
        run: ./gradlew --no-daemon assembleDebug

      - name: Prepare APK artifact
        working-directory: ${{ env.ZS_SRC }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ZeroStock-v5-debug.apk
          sha256sum ZeroStock-v5-debug.apk > ZeroStock-v5-debug.apk.sha256

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ZeroStock-v5-debug-${{ github.run_number }}
          path: |
            ${{ env.ZS_SRC }}/ZeroStock-v5-debug.apk
            ${{ env.ZS_SRC }}/ZeroStock-v5-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14

  build-release:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64"
          test -n "$KEY_ALIAS"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_PASSWORD"

      - name: Restore ZeroStock V5 source
        run: |
          mkdir -p "$RUNNER_TEMP/zerostock-v5"
          base64 --decode cloud-build/source.b64 > "$RUNNER_TEMP/zerostock-v5/source.zip"
          unzip -q "$RUNNER_TEMP/zerostock-v5/source.zip" -d "$RUNNER_TEMP/zerostock-v5/src"
          cp icon-192.png icon-512.png icon-1024.png "$RUNNER_TEMP/zerostock-v5/src/"
          echo "ZS_SRC=$RUNNER_TEMP/zerostock-v5/src" >> "$GITHUB_ENV"

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install dependencies
        working-directory: ${{ env.ZS_SRC }}
        run: npm install --no-audit --no-fund

      - name: Release gates
        working-directory: ${{ env.ZS_SRC }}
        run: npm run test:all

      - name: Build web assets
        working-directory: ${{ env.ZS_SRC }}
        run: npm run web:build

      - name: Create Android project
        working-directory: ${{ env.ZS_SRC }}
        run: npx cap add android

      - name: Configure and sync Android
        working-directory: ${{ env.ZS_SRC }}
        run: |
          npm run android:configure
          npx cap sync android

      - name: Set Android version from tag
        working-directory: ${{ env.ZS_SRC }}
        env:
          ZEROSTOCK_VERSION_NAME: ${{ github.ref_name }}
          ZEROSTOCK_VERSION_CODE: ${{ github.run_number }}
        run: |
          export ZEROSTOCK_VERSION_NAME="${ZEROSTOCK_VERSION_NAME#v}"
          node scripts/configure-version.mjs

      - name: Build unsigned release APK
        working-directory: ${{ env.ZS_SRC }}/android
        run: ./gradlew --no-daemon assembleRelease

      - name: Decode temporary keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/zerostock-release.jks"
          chmod 600 "$RUNNER_TEMP/zerostock-release.jks"

      - name: Sign, verify and checksum
        working-directory: ${{ env.ZS_SRC }}
        env:
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          UNSIGNED="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          OUT="ZeroStock-${GITHUB_REF_NAME}.apk"
          "$BUILD_TOOLS/apksigner" sign --ks "$RUNNER_TEMP/zerostock-release.jks" --ks-key-alias "$KEY_ALIAS" --ks-pass "pass:$KEYSTORE_PASSWORD" --key-pass "pass:$KEY_PASSWORD" --out "$OUT" "$UNSIGNED"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$OUT"
          sha256sum "$OUT" > "$OUT.sha256"
          rm -f "$RUNNER_TEMP/zerostock-release.jks"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: ZeroStock-${{ github.ref_name }}
          path: |
            ${{ env.ZS_SRC }}/ZeroStock-${{ github.ref_name }}.apk
            ${{ env.ZS_SRC }}/ZeroStock-${{ github.ref_name }}.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        working-directory: ${{ env.ZS_SRC }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRE=""
          case "${GITHUB_REF_NAME}" in *-rc.*|*-beta.*|*-alpha.*) PRE="--prerelease" ;; esac
          gh release create "${GITHUB_REF_NAME}"             "ZeroStock-${GITHUB_REF_NAME}.apk"             "ZeroStock-${GITHUB_REF_NAME}.apk.sha256"             --title "ZeroStock ${GITHUB_REF_NAME}"             --notes-file RELEASE-NOTES-v5.0.0-rc.1.md             $PRE
